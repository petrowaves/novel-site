<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>閱讀器｜星象之印</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .reader {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px 120px;
    }
    #chapter-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #D4AF37;
      margin-bottom: 40px;
      line-height: 1.4;
    }
    #chapter-content {
      font-size: 19px;
      line-height: 2;
      color: #ddd;
      transition: font-size 0.2s;
    }
    #chapter-content p {
      margin: 0 0 1.5em;
      text-indent: 2em;
    }
    .chapter-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid #1e2a3a;
      gap: 12px;
    }
    .chapter-nav a {
      color: #D4AF37;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid #2a3a4a;
      border-radius: 6px;
      transition: all 0.2s;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chapter-nav a:hover:not(.disabled) {
      border-color: #D4AF37;
      background: rgba(212,175,55,0.08);
    }
    .chapter-nav a.disabled {
      color: #444;
      cursor: default;
      border-color: #1a2030;
    }

    /* 頂部導航欄 */
    .reader-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(5, 8, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      color: #D4AF37;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 1; }
    .home-btn {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .home-btn:hover { opacity: 1; color: #D4AF37; }

    /* 字體控制按鈕 */
    .reader-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .font-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid #2a3a4a;
      border-radius: 8px;
      background: transparent;
      color: #D4AF37;
      cursor: pointer;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      transition: all 0.2s;
    }
    .font-btn:hover {
      border-color: #D4AF37;
      background: rgba(212, 175, 55, 0.1);
    }
    .font-btn.small { font-size: 13px; }
    .font-btn.large { font-size: 18px; }
    .font-size-display {
      font-size: 12px;
      color: #555;
      min-width: 32px;
      text-align: center;
    }
    .dark-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #2a3a4a;
      border-radius: 8px;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .dark-btn:hover {
      border-color: #D4AF37;
      color: #D4AF37;
    }
  </style>
</head>
<body>
  <div id="starfield"></div>
  <canvas id="startrail"></canvas>

  <div class="reader-header">
    <div class="nav-left">
      <a href="chapter-list.html" class="back-btn">← 章節列表</a>
      <a href="index.html" class="home-btn">🏠 首頁</a>
    </div>
    <div class="reader-controls">
      <button id="font-small" class="font-btn small" title="縮小字體">A−</button>
      <span class="font-size-display" id="font-display">19px</span>
      <button id="font-large" class="font-btn large" title="放大字體">A+</button>
      <button id="toggle-dark" class="dark-btn">🌙 夜間</button>
    </div>
  </div>

  <section class="reader">
    <h1 id="chapter-title">載入中…</h1>
    <div id="chapter-content"></div>
  </section>

  <script src="star.js"></script>
  <script src="reader.js"></script>
</body>
</html>
