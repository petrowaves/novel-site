<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>章節列表｜星象之印</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .novel-meta {
      text-align: center;
      margin-bottom: 48px;
    }

    .novel-meta h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      color: #D4AF37;
      margin: 0 0 12px;
    }

    .novel-meta p {
      color: #aaa;
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto;
    }

    .chapter-count {
      display: inline-block;
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      border: 1px solid #333;
      padding: 4px 14px;
      border-radius: 20px;
    }

    .chapter-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 已解鎖 */
    a.chapter-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border: 1px solid #1e2a3a;
      background: rgba(10, 15, 31, 0.6);
      color: #F5F5F7;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.25s;
      backdrop-filter: blur(4px);
    }

    a.chapter-card:hover {
      border-color: #D4AF37;
      color: #D4AF37;
      background: rgba(212, 175, 55, 0.06);
      transform: translateX(4px);
    }

    /* 未解鎖 */
    .chapter-card.locked {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border: 1px solid #111820;
      background: rgba(5, 8, 15, 0.5);
      color: #3a4a5a;
      border-radius: 10px;
      backdrop-filter: blur(4px);
      cursor: default;
    }

    .chapter-num {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      color: #D4AF37;
      opacity: 0.6;
      min-width: 36px;
    }

    .chapter-num.locked {
      color: #2a3a4a;
      opacity: 1;
    }

    .chapter-title {
      flex: 1;
      font-size: 15px;
    }

    .lock-info {
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .lock-days {
      color: #D4AF37;
      opacity: 0.5;
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 80px;
      color: #D4AF37;
      opacity: 0.6;
    }

    .error-msg {
      text-align: center;
      padding: 60px;
      color: #ff6b6b;
    }
  </style>
</head>

<body>
  <div id="starfield"></div>
  <canvas id="startrail"></canvas>

  <section style="padding:80px 0 100px;">
    <div class="novel-meta" id="novel-meta">
      <div class="loading">載入中…</div>
    </div>
    <div class="chapter-container" id="chapter-container"></div>
  </section>

  <footer>
    <p>© 2026 星象之印｜All Rights Reserved</p>
  </footer>

  <script src="star.js"></script>
  <script>
    // 部署後改成你的後端網址
    const API_BASE = "https://api.petrowaves.tw";
    const NOVEL_SLUG = "xingxiangzhiyin";

    function daysUntil(isoDate) {
      const now = new Date();
      const then = new Date(isoDate);
      const diff = Math.ceil((then - now) / (1000 * 60 * 60 * 24));
      return diff;
    }

    function formatCountdown(isoDate) {
      const days = daysUntil(isoDate);
      if (days <= 0) return "";
      if (days === 1) return "明天解鎖";
      if (days < 7) return `${days} 天後解鎖`;
      const weeks = Math.ceil(days / 7);
      return `約 ${weeks} 週後解鎖`;
    }

    async function loadNovel() {
      const metaEl = document.getElementById("novel-meta");
      const listEl = document.getElementById("chapter-container");
      try {
        const res = await fetch(`${API_BASE}/novels/${NOVEL_SLUG}`);
        if (!res.ok) throw new Error("找不到小說資料");
        const novel = await res.json();

        document.title = `章節列表｜${novel.title}`;

        // 只顯示 published 的章節（草稿完全隱藏）
        const chs = (novel.chapters || [])
          .filter(ch => ch.status === "published")
          .sort((a, b) => a.order - b.order);

        const unlocked = chs.filter(ch => ch.is_unlocked).length;

        metaEl.innerHTML = `
          <h1>${novel.title}</h1>
          <p>${novel.description || ""}</p>
          <span class="chapter-count">全 ${chs.length} 章・已解鎖 ${unlocked} 章</span>
        `;

        if (chs.length === 0) {
          listEl.innerHTML = `<div style="text-align:center;padding:60px;color:#555">尚無章節，敬請期待…</div>`;
          return;
        }

        listEl.innerHTML = chs.map(ch => {
          if (ch.is_unlocked) {
            return `
              <a href="reader.html?slug=${NOVEL_SLUG}&ch=${ch.id}" class="chapter-card">
                <span class="chapter-num">${ch.order}</span>
                <span class="chapter-title">${ch.title}</span>
                <span style="font-size:11px;color:#444">閱讀 →</span>
              </a>`;
          } else {
            const countdown = ch.release_at ? formatCountdown(ch.release_at) : "即將解鎖";
            return `
              <div class="chapter-card locked">
                <span class="chapter-num locked">🔒</span>
                <span class="chapter-title">${ch.title}</span>
                <span class="lock-days">${countdown}</span>
              </div>`;
          }
        }).join("");

      } catch (err) {
        metaEl.innerHTML = `<div class="error-msg">⚠️ ${err.message}<br><small>請確認後端服務運行中（${API_BASE}）</small></div>`;
      }
    }

    loadNovel();
  </script>
</body>

</html>
